# The shared fly's hourly save (see src/timeline.js).
# Plays the fly forward to now and publishes its latest checkpoint on the fly-data branch, which
# every page reads. That branch holds a single commit that is replaced each time, so the repo does
# not grow. If this stops for a while, nothing breaks: pages just catch up from an older checkpoint.
name: Shared fly

on:
  schedule:
    - cron: '17 * * * *'     # every hour, at 17 minutes past
  workflow_dispatch:          # and on demand, from the Actions tab

permissions:
  contents: write

concurrency:
  group: shared-fly
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        run: git clone --depth 1 --branch "${{ github.event.repository.default_branch }}" "https://github.com/${{ github.repository }}.git" code

      - name: Get the last checkpoint
        working-directory: code
        run: |
          if git fetch --depth 1 origin fly-data 2>/dev/null; then
            git show FETCH_HEAD:checkpoint.json > ../last.json
          else
            echo "No fly-data branch yet: the fly is played from its birth."
          fi

      - name: Play the fly forward to now
        run: node code/tools/advance_fly.js last.json fly/checkpoint.json

      - name: Publish the new checkpoint
        env:
          TOKEN: ${{ github.token }}
        run: |
          if [ ! -f fly/checkpoint.json ]; then echo "Nothing to publish yet."; exit 0; fi
          if [ -f last.json ] && cmp -s last.json fly/checkpoint.json; then echo "No new checkpoint since the last run."; exit 0; fi
          cd fly
          # this branch is data only: tell Vercel not to deploy it, whichever folder the project uses
          mkdir -p web
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          cp vercel.json web/vercel.json
          printf '%s\n' "The shared fly's latest memory (checkpoint.json), saved every hour by .github/workflows/fly.yml on the main branch." > README.md
          git init -q -b fly-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "The shared fly at hand $(node -p "require('./checkpoint.json').hands")"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" fly-data
          echo "Published."
